# The system packages RealmCradle needs, in one place: install.sh installs them, and the .deb
# package declares them (tools/build-deb.sh) so apt installs them automatically.
#
# "group: package package ..."   — "a | b" means the first of them that this system offers.
# required: what RealmCradle itself needs (the package "Depends" on these).
# games: libraries game servers load — always installed by install.sh; the package "Recommends"
#   them, which apt installs by default, so the package still installs where one is missing.
# The rest are optional extras some games need (installed by default; `install.sh --minimal` or
# `apt install --no-install-recommends` skips them).

# Python for the dashboard; openssl for its certificate
required: python3 python3-venv openssl curl ca-certificates
# lib32gcc-s1: Valve's server downloader (steamcmd) is a 32-bit program · libatomic1, libpulse0:
# Valheim · xvfb, libxi6: an invisible display (Core Keeper, V Rising, Sons of the Forest) ·
# libgdiplus: Eco
games: lib32gcc-s1 libatomic1 libpulse0 xvfb libxi6 libgdiplus

# Minecraft (Java edition) needs a recent Java
java: openjdk-25-jre-headless | openjdk-21-jre-headless | default-jre-headless
# Windows-only game servers run through Wine
wine: wine
# Space Engineers also needs these to prepare its Wine environment
wine-extras: winetricks cabextract
# blocks addresses that keep guessing the dashboard password
fail2ban: fail2ban
