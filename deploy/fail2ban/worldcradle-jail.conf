# fail2ban jail for the worldcradle dashboard.
# Install to: /etc/fail2ban/jail.d/worldcradle.conf
#
# Bans an IP that fails the dashboard login too many times, at the firewall,
# on the dashboard's port only (so a friend fumbling the password isn't cut off from the
# game servers). Complements the app's in-memory per-IP rate limit.
[worldcradle]
enabled  = true
filter   = worldcradle
# Path to WorldCradle's audit log. Default data root is ~/.config/worldcradle; replace
# __WORLDCRADLE_LOGS__ with the ABSOLUTE logs dir of the user running WorldCradle
# (fail2ban runs as root, so ~ won't expand). setup.sh fills in this path and the port.
# e.g. logpath = /home/youruser/.config/worldcradle/logs/audit.log
logpath  = __WORLDCRADLE_LOGS__/audit.log
port     = __PORT__
protocol = tcp
maxretry = 4
findtime = 600
bantime  = 3600
# Never ban localhost. Add your own LAN/VPN range so you can't lock yourself out,
# e.g. "127.0.0.1/8 ::1 192.168.1.0/24".
ignoreip = 127.0.0.1/8 ::1
backend  = auto
