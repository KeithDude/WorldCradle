# fail2ban filter for worldcradle — matches failed/blocked logins in audit.log.
# Install to: /etc/fail2ban/filter.d/worldcradle.conf
#
# audit.log lines look like:
#   2026-06-18 15:43:43 WARNING login FAILED ip=203.0.113.5
#   2026-06-18 15:44:01 WARNING login blocked (locked out) ip=203.0.113.5
[Definition]
failregex = login FAILED ip=<HOST>$
            login blocked \(locked out\) ip=<HOST>$
ignoreregex =
# NOTE: fail2ban's parser uses % for interpolation, so literal % must be doubled.
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
