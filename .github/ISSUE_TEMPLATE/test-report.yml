name: Game test report
description: Tell us how a game worked when you ran its server with RealmCradle
title: "[Test] <game name>"
labels: ["test report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Most games are marked **Not Tested** in docs/SUPPORTED_GAMES.md until
        someone confirms them. **Never paste passwords** (the join or admin password) anywhere here.
  - type: input
    id: game
    attributes: {label: Game, placeholder: "e.g. Project Zomboid"}
    validations: {required: true}
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options: ["Worked — friends could join and play", "Partly worked (see below)", "Didn't work"]
    validations: {required: true}
  - type: checkboxes
    id: checks
    attributes:
      label: What did you check?
      options:
        - label: Joined from my own home network
        - label: Joined from outside my home (a friend, or my computer connected to my phone's Mobile Hotspot)
        - label: The join password was needed, and a wrong one was refused
        - label: The server card showed the players
        - label: My progress was still there after Stop then Start
        - label: The dashboard's Save / Message buttons worked (if shown)
  - type: textarea
    id: notes
    attributes:
      label: What happened
      description: Anything that didn't work, or that was confusing — and the points listed for this game in SUPPORTED_GAMES.md.
  - type: textarea
    id: log
    attributes:
      label: Server log (if something failed)
      description: From the server's card → Logs. Check it contains no passwords before pasting.
      render: text
  - type: input
    id: system
    attributes: {label: Your system, placeholder: "e.g. Ubuntu 24.04, 16 GB RAM, RealmCradle version from 'realmcradle version'"}
