# Publishing a version: push a tag like v0.2.0 (VERSION must say 0.2.0 and CHANGELOG.md must have a
# "## 0.2.0" section). This runs the tests, builds the package, and creates the GitHub release with
# the package, its checksum, and that CHANGELOG section as the notes. `worldcradle update` and get.sh
# install from these releases.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write                 # to create the release
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag, VERSION and CHANGELOG agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$(tr -d '[:space:]' < VERSION)" = "$version" ] \
            || { echo "VERSION says $(cat VERSION), the tag says $version"; exit 1; }
          grep -q "^## $version\b" CHANGELOG.md || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
      - name: No test-only switches left in the program
        run: |
          if grep -rn "WORLDCRADLE_RELEASES_URL" app/; then
            echo "Remove the update test switch before releasing (see docs/ROADMAP.md)"; exit 1
          fi
      - name: Python libraries and test tools
        run: |
          python3 -m venv venv
          venv/bin/pip install -q --require-hashes -r requirements.lock
          venv/bin/pip install -q -r requirements-dev.txt
      - name: Tests
        run: venv/bin/python -m pytest -q tests && venv/bin/python -m pyflakes app tests
      - name: Build the package
        run: bash tools/build-deb.sh
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          printf '\n---\nInstall: see [Getting started](%s/blob/%s/docs/GETTING_STARTED.md). Already installed: `worldcradle update`.\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.deb.sha256 --title "WorldCradle ${GITHUB_REF_NAME#v}" --notes-file notes.md
